<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Workshop · Wand</title>
<style>
  :root { --brand: #40BFC0; --teal: #40BFC0; --ink: #1C1917; --muted: #5F5F5F; --bg: #FAFAF7; --note: #FFF4C7; --note2: #D9F0E4; --ai: #EAF9F9; --aiink: #409E9F;
          --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 20px/1.4 var(--font); border-top: 12px solid var(--brand);
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; gap: 28px; align-items: flex-start; padding: 16px 36px 4px; flex: none; }
  .head { flex: 1; }
  .step { display: flex; align-items: center; gap: 12px; font-size: clamp(17px, 1.5vw, 24px); font-weight: 800; color: var(--ink); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 6px; }
  .step img { width: 1.9em; height: 1.9em; }
  .step small { font-weight: 400; color: var(--muted); font-size: inherit; }
  h1 { font-size: clamp(24px, 2.6vw, 40px); line-height: 1.2; margin: 0 0 4px; font-style: italic; font-weight: 700; color: var(--teal); }
  .how { color: var(--muted); margin: 0; }
  .join { text-align: center; font-size: 13px; color: var(--muted); }
  .join img { display: block; width: 92px; height: 92px; margin: 0 auto 2px; background: #fff; padding: 5px; border-radius: 8px; }
  .join.big img { width: min(46vh, 420px); height: min(46vh, 420px); }
  .join.big { font-size: 22px; color: var(--ink); }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px 36px 34px; }
  #aibtn { border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: clamp(14px, 1.1vw, 19px); padding: 6px 16px; border-radius: 999px;
           background: var(--aiink); color: #fff; align-self: center; white-space: nowrap; }
  #aibtn:hover { box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #stage { flex: 1; min-height: 0; position: relative; }
  #counter { text-align: center; padding: 8vh 0; }
  #counter .n { font-size: clamp(90px, 16vw, 220px); font-weight: 800; line-height: 1; }
  #counter p { font-size: 28px; color: var(--muted); margin: 8px 0 0; }
  /* Mosaik: alle Post-its passen immer auf den Bildschirm. Schriftgroesse und Kachelbreite ergeben sich aus Anzahl, Textlaenge und Flaeche. */
  #mosaic { position: absolute; inset: 0; --lines: 3; }
  #custom { position: absolute; inset: 0; overflow: hidden; }
  .block { position: absolute; display: flex; flex-direction: column; padding: 3px; }
  .bhead { flex: none; display: flex; align-items: center; gap: 12px; margin: 0 0 6px; }
  .bhead .btitle { font-size: clamp(20px, 2vw, 32px); padding: 3px 18px; margin: 0; cursor: default; }
  .bhead button { border: 1px solid #C9C9C2; background: none; cursor: pointer; font: inherit; font-size: 15px; color: var(--muted); padding: 3px 12px; border-radius: 999px; }
  .btitle { flex: none; align-self: flex-start; cursor: pointer; font-weight: 700; font-size: clamp(12px, 1vw, 17px); padding: 1px 10px; border-radius: 999px; margin: 0 0 3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .btitle span { font-weight: 400; color: var(--muted); }
  .tiles { flex: 1; min-height: 0; overflow: hidden; }
  .inner { display: flex; flex-wrap: wrap; align-content: flex-start; gap: .28em; }
  .tile { height: calc(var(--lines) * 1.25em + .7em); padding: .35em .55em; border-radius: .25em; background: var(--note); box-shadow: 0 1px 2px rgba(0,0,0,.16);
          line-height: 1.25; overflow: hidden; transform-origin: 0 0; transition: background-color .6s; }
  .tile span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines); overflow: hidden; overflow-wrap: anywhere; hyphens: auto; }
  .tile.alt { background: var(--note2); }
  .tile.pop { animation: pop .5s ease-out; z-index: 1; }
  @keyframes pop { 40% { transform: scale(1.12); } }
  .c-gelb { background: #FFF1B8; } .c-grün { background: #D3EFDD; } .c-blau { background: #D6E6FB; } .c-rosa { background: #FAD9E6; }
  .c-orange { background: #FFDDBB; } .c-lila { background: #E6DBF7; } .c-türkis { background: #CDEEEE; } .c-koralle { background: #FFD5CC; }
  .c-none { background: #ECECE6; }
  #say { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 3; pointer-events: none; font-weight: 800; white-space: nowrap;
         font-size: clamp(26px, 3.4vw, 56px); padding: 10px 34px; border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  #say small { font-weight: 400; color: var(--muted); font-size: .7em; }
  #say.in { animation: say .65s ease-out both; }
  @keyframes say { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); } 25%, 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; } }
  #pager { position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); }
  #pager button { border: 0; background: #ECECE6; cursor: pointer; font: inherit; font-size: 18px; width: 34px; height: 26px; border-radius: 999px; }
  /* KI-Auswertung: eigene Ansicht auf der Wand, per Knopf. */
  #panel { position: absolute; inset: 0; overflow: hidden; background: var(--ai); border-left: 10px solid var(--aiink); border-radius: 8px; padding: 22px 30px; }
  #panel h2 { font-size: .72em; letter-spacing: .06em; text-transform: uppercase; color: var(--aiink); margin: 0 0 8px; }
  #panel .headline { font-size: 1.8em; font-weight: 800; line-height: 1.2; margin: 0 0 .55em; max-width: 34em; }
  #panel .cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: .8em; }
  #panel .card { background: rgba(255,255,255,.75); border-radius: 8px; padding: .7em .9em; }
  #panel h3 { font-size: .72em; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  #panel .item { margin: 0 0 .6em; }
  #panel .item b { display: block; }
  #panel .item button { border: 0; cursor: pointer; font: inherit; font-weight: 700; padding: 2px 12px; border-radius: 999px; margin: 0 0 3px; }
  #panel q { color: var(--muted); }
  .rv { animation: rise .6s ease-out backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  footer { position: fixed; right: 16px; bottom: 8px; font-size: 13px; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="head">
    <p class="step" id="step"></p>
    <h1 id="q"></h1>
    <p class="how" id="how"></p>
  </div>
  <button id="aibtn" hidden></button>
  <div class="join" id="join"><img src="qr.png" alt="QR-Code zum Mitschreiben"><span id="url"></span></div>
</header>
<main>
  <div id="stage">
    <div id="counter" hidden><div class="n" id="n">0</div><p id="nlabel">Gedanken bisher</p></div>
    <div id="mosaic"></div>
    <div id="custom" hidden></div>
    <div id="say" hidden></div>
    <section id="panel" hidden></section>
  </div>
</main>
<div id="pager" hidden><button id="pprev">‹</button><span id="pnum"></span><button id="pnext">›</button></div>
<footer id="foot"></footer>

<script src="steps.js"></script>
<script src="viz-lanes.js"></script>
<script src="viz-ranking.js"></script>
<script src="viz-pairs.js"></script>
<script src="viz-patterns.js"></script>
<script src="viz-map.js"></script>
<script src="viz-agenda.js"></script>
<script>
// Mit #k=<Schluessel> (wie die Steuerseite) kann die Moderation die KI-Auswertung direkt auf der Wand freigeben.
const K = decodeURIComponent((location.hash.match(/k=([^&]+)/) || [])[1] || '');
$('url').textContent = location.href.replace(/^https?:\/\//, '').replace(/wall\.html.*$/, '');
let polling = false, busy = false, lastRev = null, prevReleased = null;
let view = null, counter = false, wasThemed = false, forceFlat = false;
let focus = null;   // null = alle Post-its, Zahl = ein Thema, 'ai' = KI-Auswertung
let navCount = 0;    // Zahl der Dinge, die ein Baustein einzeln in Szene setzen kann (Pfeiltasten)
let page = 0, pages = 1;   // wenn nicht alles lesbar auf einen Bildschirm passt: Seiten, die von rechts nachruecken
let ai = null;      // { step, released, data }
const sleep = ms => new Promise(r => setTimeout(r, ms));
function el(tag, text, cls) { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }

// ---------- Mosaik ----------
function tileEl(r) { const e = el('div', null, 'tile'); e.dataset.id = r.id; e.append(el('span', r.body)); return e; }
const emWidth = (text, lines, cap) => Math.max(8, Math.min(text.length, cap)) / lines * (cap > 200 ? 0.58 : 0.5) + 1.7;   // Einzelansicht: breiter, damit nichts gekuerzt wird

function blocks() {
  const { rows, themes, themed, s } = view;
  if (!themes.length || forceFlat) return [{ key: 'flat', rows, cls: r => r.step !== s.show[0] ? 'alt' : '' }];
  const byId = new Map(rows.map(r => [r.id, r])), used = new Set();
  const out = themes.map((t, k) => { const list = t.ids.map(i => byId.get(i)).filter(Boolean); list.forEach(r => used.add(r.id));
    return { key: k, label: t.label, rows: list, cls: () => 'c-' + t.color }; });
  if (typeof focus === 'number') return [out[focus]];
  out.push({ key: 'x', label: 'Einzelstimmen', rows: rows.filter(r => themed.includes(r.step) && !used.has(r.id)), cls: () => 'c-none' });
  s.show.filter(x => !themed.includes(x)).forEach(x => out.push({ key: 'o' + x, label: stepById(x).label, rows: rows.filter(r => r.step === x), cls: () => 'alt' }));
  return out.filter(b => b.rows.length);
}

// Squarified Treemap: teilt die Flaeche so auf, dass jedes Thema Platz nach seiner Textmenge bekommt.
function squarify(vals, x, y, w, h) {
  const total = vals.reduce((a, b) => a + b, 0), areas = vals.map(v => v * w * h / total), rects = [];
  const worst = (row, side) => { const s = row.reduce((a, b) => a + b, 0); return Math.max(side * side * Math.max(...row) / (s * s), s * s / (side * side * Math.min(...row))); };
  let row = [], i = 0;
  const flush = () => { const s = row.reduce((a, b) => a + b, 0);
    if (w >= h) { const cw = s / h; let cy = y; row.forEach(a => { rects.push({ x, y: cy, w: cw, h: a / cw }); cy += a / cw; }); x += cw; w -= cw; }
    else { const ch = s / w; let cx = x; row.forEach(a => { rects.push({ x: cx, y, w: a / ch, h: ch }); cx += a / ch; }); y += ch; h -= ch; }
    row = []; };
  while (i < areas.length) { const side = Math.min(w, h), next = row.concat(areas[i]);
    if (!row.length || worst(next, side) <= worst(row, side)) { row = next; i++; } else flush(); }
  if (row.length) flush();
  return rects;
}

// Kleinste Schrift, bevor geblaettert statt weiter verkleinert wird.
const FLOOR = { all: 9, one: 15 };

function buildBlocks(m, bl, old, one, lines, cap) {
  const W = m.clientWidth, H = m.clientHeight;
  const rects = bl.length > 1 ? squarify(bl.map(b => b.v), 0, 0, W, H) : [{ x: 0, y: 0, w: W, h: H }];
  m.textContent = '';
  return bl.map((b, n) => { const r = rects[n], box = el('div', null, 'block'), tiles = el('div', null, 'tiles'), inner = el('div', null, 'inner');
    box.style.cssText = `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`;
    if (b.label && one) { const h = el('div', null, 'bhead'), back = el('button', '← Alle'), t = el('div', b.label + ' ', 'btitle ' + b.cls());
      back.onclick = () => go(null); t.append(el('span', '· ' + b.rows.length)); h.append(back, t); box.append(h); }
    else if (b.label) { const t = el('div', b.label + ' ', 'btitle ' + b.cls()); t.append(el('span', '· ' + b.rows.length));
      if (typeof b.key === 'number') t.onclick = () => go(b.key); box.append(t); }
    b.rows.forEach(r => { const e = old.get(String(r.id)) || tileEl(r), w = emWidth(r.body, lines, cap);
      e.className = 'tile ' + b.cls(r); e.style.flex = `${Math.round(w * 10)} 1 ${w}em`; e.style.maxWidth = w * 2.4 + 'em'; e.title = r.body; inner.append(e); });
    tiles.append(inner); box.append(tiles); m.append(box);
    return { box, tiles, inner }; });
}
// groesste Schrift in [lo, hi], bei der der Block ganz hineinpasst; null, wenn selbst lo nicht reicht
function fitBlock(x, lo, hi) {
  const fits = f => { x.box.style.fontSize = f + 'px'; return x.inner.offsetHeight <= x.tiles.clientHeight + 1; };
  if (!fits(lo)) return null;
  if (fits(hi)) return hi;
  for (let k = 0; k < 7; k++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
  return lo;
}
// Themen auf n Seiten verteilen, grob gleich viel Text pro Seite
function partition(bl, n) {
  const target = bl.reduce((a, b) => a + b.v, 0) / n, parts = [[]]; let sum = 0;
  bl.forEach(b => { if (sum + b.v / 2 > target && parts.length < n && parts[parts.length - 1].length) { parts.push([]); sum = 0; } parts[parts.length - 1].push(b); sum += b.v; });
  return parts;
}

function layoutMosaic(animate, dir) {
  const m = $('mosaic');
  const old = new Map([...m.querySelectorAll('.tile')].map(e => [e.dataset.id, e]));
  const first = new Map(animate ? [...old].map(([id, e]) => [id, e.getBoundingClientRect()]) : []);
  const one = typeof focus === 'number', lines = one ? 4 : 3, cap = one ? 400 : 150;
  const bl = blocks().map(b => ({ ...b, v: b.rows.reduce((a, r) => a + emWidth(r.body, lines, cap) + .3, 0) + 6 })).sort((a, b) => b.v - a.v);
  m.style.setProperty('--lines', lines);
  if (bl.length > 1) {
    // Uebersicht: alle Themen auf einer Seite; nur wenn die Schrift unter die Untergrenze fiele, auf mehrere Seiten verteilen.
    let parts = [bl];
    for (let n = 1; n <= bl.length; n++) { parts = partition(bl, n);
      if (n === bl.length || parts.every(p => buildBlocks(m, p, old, one, lines, cap).every(x => fitBlock(x, FLOOR.all, FLOOR.all) !== null))) break; }
    pages = parts.length; page = Math.min(page, pages - 1);
    const xs = buildBlocks(m, parts[page], old, one, lines, cap), fs = xs.map(x => fitBlock(x, FLOOR.all, 22) || FLOOR.all), least = Math.min(...fs);
    xs.forEach((x, i) => x.box.style.fontSize = Math.min(fs[i], least * 1.3) + 'px');   // Themen duerfen etwas groesser sein als das engste, aber nicht wild verschieden
  } else {
    // Ein Block (ungefaerbt oder ein Thema): passt er bei der Untergrenze nicht, wird zeilenweise geblaettert.
    const x = buildBlocks(m, bl, old, one, lines, cap)[0], floor = one ? FLOOR.one : FLOOR.all, f = fitBlock(x, floor, 30);
    pages = 1;
    if (f !== null) x.box.style.fontSize = f + 'px';
    else { x.box.style.fontSize = floor + 'px';
      const t = x.inner.firstElementChild, gap = parseFloat(getComputedStyle(x.inner).rowGap) || 0, rowH = t.offsetHeight + gap;
      const pageH = Math.max(1, Math.floor((x.tiles.clientHeight + gap) / rowH)) * rowH;
      pages = Math.ceil((x.inner.offsetHeight + gap) / pageH); page = Math.min(page, pages - 1);
      x.tiles.style.flex = 'none'; x.tiles.style.height = (pageH - gap) + 'px'; x.inner.style.transform = `translateY(${-page * pageH}px)`; }
  }
  $('pager').hidden = pages < 2; $('pnum').textContent = (page + 1) + ' / ' + pages;
  if (dir) { m.animate([{ transform: `translateX(${dir * 90}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 380, easing: 'ease-out' }); return; }   // Seite rueckt von der Seite nach
  if (!animate) return;
  m.querySelectorAll('.btitle').forEach(t => t.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: 700, fill: 'backwards' }));
  flip(m, first);
}
// Gemeinsamer Flug: jedes Element mit data-id fliegt von seinem alten Platz (first: Map id -> DOMRect) an den neuen. Neue blenden ein.
function flip(box, first) {
  let i = 0;
  box.querySelectorAll('[data-id]').forEach(e => { const a = first && first.get(e.dataset.id), b = e.getBoundingClientRect();
    if (!a || !a.width) { e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400 }); return; }
    if (Math.abs(a.left - b.left) < 1 && Math.abs(a.top - b.top) < 1 && Math.abs(a.width - b.width) < 1) return;
    e.animate([{ transform: `translate(${a.left - b.left}px,${a.top - b.top}px) scale(${a.width / b.width},${a.height / b.height})`, transformOrigin: '0 0' }, { transform: 'none', transformOrigin: '0 0' }],
              { duration: 1200, delay: Math.min(i++ * 4, 450), easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }); });
}
const rectsOf = box => new Map([...box.querySelectorAll('[data-id]')].map(e => [e.dataset.id, e.getBoundingClientRect()]));

// ---------- Navigation: Themen stehen nur als Ueberschrift ueber ihren Post-its (Felix, 12.11.). Klick oder Pfeiltasten setzen eins in Szene.
function aiButton() {
  const b = $('aibtn'); b.hidden = !ai; if (!ai) return;
  b.textContent = focus === 'ai' ? '← ' + (view && (view.s.lsDef || LS[view.s.ls] || {}).noun || 'Post-its') : '✨ KI-Auswertung';
  b.onclick = () => go(focus === 'ai' ? null : 'ai');
}

async function go(key, d) {
  if (busy) return;
  if (key === 'ai' && ai && !ai.released) {   // Freigabe direkt auf der Wand
    await rpc('lf_release', { p_key: K, p_step: ai.step, p_released: true });
    ai.released = true; if (prevReleased) prevReleased.push(ai.step);
  }
  const was = focus; focus = key; page = 0; draw(true);
  // eigene Bausteine: das naechste Ding rueckt von der Seite herein (von rechts beim Vorwaertsgehen)
  if (custom() && focus !== 'ai' && was !== 'ai' && was !== key) $('custom').animate([{ transform: `translateX(${(d || (key === null ? -1 : 1)) * 120}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: 'ease-out' });
}
function turn(d) {   // blaettern; am Rand weiter zum naechsten Thema
  if (busy || !view) return;
  if (page + d >= 0 && page + d < pages && focus !== 'ai') { page += d; draw(false, d); return; }
  const n = custom() ? navCount : view.themes.length;
  if (!n) return;
  const order = [null, ...Array.from({ length: n }, (x, k) => k), ...(ai ? ['ai'] : [])], i = order.indexOf(focus);
  go(order[(i + d + order.length) % order.length], d);
}
$('pprev').onclick = () => turn(-1); $('pnext').onclick = () => turn(1);

function renderPanel(animate) {
  const box = $('panel'), r = ai.data || {}, titles = ai.titles || (LS[stepById(ai.step).ls] || {}).panel || PANEL; box.textContent = ''; let n = 0;
  const rv = e => { if (animate) { e.classList.add('rv'); e.style.animationDelay = (n++ * .22) + 's'; } return e; };   // nur beim Oeffnen einblenden, nicht beim Neu-Einpassen
  const noun = view && ((view.s.lsDef || LS[view.s.ls] || {}).noun) || 'Post-its';
  box.append(rv(el('h2', 'KI-Auswertung · ' + (view ? view.rows.length + ' ' + noun : 'eure Beiträge'))));
  if (r.headline) box.append(rv(el('p', r.headline, 'headline')));
  const cols = el('div', null, 'cols'); box.append(cols);
  const card = (title, arr, fn) => { if (!arr || !arr.length) return; const c = rv(el('div', null, 'card')); c.append(el('h3', title)); arr.forEach(x => c.append(rv(fn(x)))); cols.append(c); };
  // Eintraege, deren Name zu einem Thema / einer Bahn / einem Muster / einem Paar passt, fuehren per Klick dorthin.
  const d0 = view && view.data || {}, things = view ? (view.themes.length ? view.themes : d0.lanes ? (d0.banner ? [d0.banner, ...d0.lanes] : d0.lanes) : d0.patterns || d0.pairs || d0.zones || []) : [];
  const find = label => things.findIndex(t => t.label === label || t.question === label);
  const link = (d, label, text) => { const k = find(label); if (k < 0) return d.append(el('b', text));
    const b = el('button', text, 'c-' + (things[k].color || 'none')); b.onclick = () => go(k); d.append(b); };
  card(titles[0], r.convergence, c => { const d = el('div', null, 'item');
    link(d, c.label, c.label + (c.ids ? ' · ' + c.ids.length : ''));
    if (c.quote) d.append(el('q', c.quote)); return d; });
  card(titles[1], r.tension, t => { const d = el('div', null, 'item'); link(d, t.label, t.label); d.append(document.createTextNode(t.a + ' ↔ ' + t.b)); return d; });
  card(titles[2], r.blind_spots, b => { const d = el('div', null, 'item'); d.append(el('b', b.label), document.createTextNode(b.why || '')); return d; });
  // Schrift so waehlen, dass die Auswertung ohne Scrollen auf die Flaeche passt
  let f = 28; do { box.style.fontSize = f + 'px'; f -= 1; } while (box.scrollHeight > box.clientHeight + 1 && f >= 10);
}

function draw(animate, dir) {
  aiButton();
  const showAi = focus === 'ai' && ai && ai.released;
  $('counter').hidden = !counter || showAi;
  $('panel').hidden = !showAi; if (showAi) renderPanel(animate);
  const viz = !forceFlat && custom(), off = counter || showAi || !view;
  $('mosaic').hidden = off || !!viz; $('custom').hidden = off || !viz;
  if (off) { $('pager').hidden = true; if (!view) $('mosaic').textContent = ''; }
  else if (viz) { const r = viz.draw($('custom'), ctx(dir)) || {}; navCount = r.count || 0; pages = r.pages || 1; page = Math.min(page, pages - 1);
    $('pager').hidden = pages < 2; $('pnum').textContent = (page + 1) + ' / ' + pages; }
  else layoutMosaic(animate, dir);
}
// Eigener Baustein der aktuellen Struktur (viz-*.js), sonst null = Themen-Mosaik
function custom() { return view && view.data && VIZ[view.data.viz] || null; }
function ctx(dir, from) { return { rows: view.rows, data: view.data, s: view.s, focus: typeof focus === 'number' ? focus : null, page, dir: dir || 0, from: from || null, go, el, sleep, flip }; }
// Uebergang vom ungeordneten Mosaik zur Darstellung der Struktur
async function reveal() {
  const viz = custom(); if (!viz) return showThemes();
  busy = true; page = 0;
  const from = rectsOf($('mosaic'));
  if (viz.reveal) { $('mosaic').hidden = true; $('custom').hidden = false; await viz.reveal($('custom'), ctx(0, from)); }
  busy = false; draw(false);
}

// Show-Effekt (reine Browser-Animation, keine KI): Themen erscheinen nacheinander, ihre Post-its faerben sich an Ort und Stelle,
// dann fliegen alle in ihre Themenflaeche.
async function showThemes() {
  busy = true; page = 0;
  const say = $('say'), els = new Map([...$('mosaic').querySelectorAll('.tile')].map(e => [+e.dataset.id, e]));
  await sleep(500);
  for (const t of view.themes) {
    say.className = 'c-' + t.color; say.textContent = t.label + ' '; say.append(el('small', '· ' + t.ids.filter(id => els.has(id)).length));
    say.hidden = false; void say.offsetWidth; say.classList.add('in');   // Themenname blitzt gross auf
    t.ids.forEach((id, j) => { const e = els.get(id); if (e) setTimeout(() => { e.className = 'tile pop c-' + t.color; }, j * 30); });
    await sleep(700);
  }
  say.hidden = true; await sleep(500);
  layoutMosaic(true); await sleep(1800);
  busy = false;
}

addEventListener('keydown', async e => {
  if (busy || polling || !view) return;
  if (e.key === 'ArrowRight') turn(1);
  else if (e.key === 'ArrowLeft') turn(-1);
  else if (e.key === 'Escape') go(null);
  else if (e.key.toLowerCase() === 'r' && (view.themes.length || custom())) {   // Uebergang nochmal zeigen
    focus = null; page = 0; forceFlat = true; draw(false); forceFlat = false; busy = true; await sleep(1200); busy = false; await reveal(); }
});
let wheelAt = 0;   // Mausrad oder Wischen blaettert, wenn es mehrere Seiten gibt
addEventListener('wheel', e => { const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (pages < 2 || focus === 'ai' || Math.abs(d) < 20 || Date.now() - wheelAt < 500) return; wheelAt = Date.now();
  const n = page + Math.sign(d); if (n >= 0 && n < pages) turn(Math.sign(d)); }, { passive: true });
// Neu einpassen, sobald sich die Flaeche aendert (Fenster, Vollbild, Beamerwechsel)
let rz; new ResizeObserver(() => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (!busy && (view || focus === 'ai')) draw(false); }); }).observe($('stage'));

// Kopf: Icon + Name der Struktur, darunter die Frage (kursiv, Teal)
function header(s, people) {
  const ls = s.lsDef || LS[s.ls], head = $('step'); head.textContent = '';
  if (ls) { const im = el('img'); im.src = 'icons/' + ls.icon + '.svg'; im.alt = ''; head.append(im, el('span', ls.name), el('small', s.phase ? '· ' + s.phase : '')); } else head.append(el('span', s.label));
  $('q').textContent = s.q; $('how').textContent = s.how || '';
  $('foot').textContent = people + (people === 1 ? ' Handy hat' : ' Handys haben') + ' schon beigetragen';
}

// ---------- Zustand holen ----------
async function refresh(st) {
  const s = stepById(st.step);
  header(s, st.people); $('join').className = 'join' + (st.step === 0 ? ' big' : '');
  counter = s.solo && st.wall === 'counter';
  $('n').textContent = st.count; $('nlabel').textContent = st.count === 1 ? 'Gedanke bisher' : 'Gedanken bisher';
  let themes = [];
  if (!counter && s.show.length) {
    const rows = await rpc('lf_wall', { p_steps: s.show });
    // Themen: sobald die KI zugeordnet hat, erscheinen sie ohne Freigabe (Felix, 12.11.).
    const themed = s.show.filter(x => st.released.includes(String(THEMES + x)));
    const payloads = await Promise.all(themed.map(x => rpc('lf_result', { p_step: THEMES + x })));
    const data = payloads.find(t => t && t.viz && VIZ[t.viz]) || null;   // Struktur mit eigenem Baustein
    themes = data ? [] : payloads.flatMap(t => (t && t.themes) || []);
    view = { rows, themes, themed, s, data };
  } else view = null;
  const has = themes.length > 0 || !!(view && view.data);
  if (typeof focus === 'number' && !custom() && focus >= themes.length) focus = null;
  // KI-Auswertung: mit Schluessel sieht die Wand auch Entwuerfe (Knopf gibt frei), sonst nur Freigegebenes.
  const rel = st.released.map(Number).filter(x => x < THEMES);
  const drafts = K ? await rpc('lf_drafts', { p_key: K }).catch(() => ({})) : {};
  const have = [...new Set([...rel, ...Object.keys(drafts || {}).map(Number).filter(x => x < THEMES)])];
  const fresh = prevReleased ? rel.filter(x => !prevReleased.includes(x)) : [];
  const mine = s.show.filter(x => have.includes(x));
  const pick = fresh.length ? Math.max(...fresh) : mine.length ? mine[mine.length - 1] : have.length ? Math.max(...have) : null;
  prevReleased = rel;
  if (pick == null) ai = null;
  else { const released = rel.includes(pick);
    ai = { step: pick, released, data: released ? await rpc('lf_result', { p_step: pick }) : (drafts[pick] || {}).data }; }
  if (fresh.length) focus = 'ai';                       // frisch freigegeben: sofort zeigen, egal in welchem Schritt
  if (focus === 'ai' && !(ai && ai.released)) focus = null;
  if (has && !wasThemed && focus === null && !$('mosaic').hidden && $('mosaic').querySelector('.tile')) await reveal();   // Post-its hingen schon: Uebergang zeigen
  else draw(fresh.length > 0);
  wasThemed = has;
}

async function poll() {
  if (polling || busy) return; polling = true;
  try { const st = await rpc('lf_get_state', null, 5000);
        const sig = st.rev + '|' + st.step + '|' + st.wall + '|' + st.released.join(',');
        if (sig !== lastRev) { lastRev = sig; await refresh(st); } }
  catch (e) { lastRev = null; }
  polling = false;
}
// Testmodus ohne Datenbank: wall.html?demo=fixtures/<datei>.json&show=flat|reveal|focus:N|page:N|ai (kombinierbar mit Komma)
const QS = new URLSearchParams(location.search), DEMO = QS.get('demo');
async function demo() {
  const fx = await (await fetch(DEMO)).json(), show = (QS.get('show') || '').split(',');
  header(fx.step, fx.people || 0);
  view = { rows: fx.rows, themes: [], themed: fx.step.show, s: fx.step, data: null };
  ai = fx.ai ? { step: null, released: true, data: fx.ai, titles: (fx.step.lsDef || {}).panel } : null;
  const apply = () => { const d = fx.data; if (d && d.viz && VIZ[d.viz]) view.data = d; else if (d) view.themes = d.themes || []; };
  if (show.includes('flat')) return draw(false);
  if (show.includes('reveal')) { draw(false); await sleep(800); apply(); return reveal(); }
  apply();
  show.forEach(x => { const m = x.match(/^(focus|page):(\d+)$/); if (m && m[1] === 'focus') focus = +m[2]; if (m && m[1] === 'page') page = +m[2]; if (x === 'ai') focus = 'ai'; });
  draw(false);
}
if (DEMO) demo(); else { setInterval(poll, 2500); poll(); }
</script>
