<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Workshop · Wand</title>
<style>
  :root { --brand: #FFC83B; --accent: #B4530A; --ink: #1B1B1B; --muted: #5F5F5F; --bg: #FAFAF7; --note: #FFF4C7; --note2: #D9F0E4; --ai: #E7EEF9;
          --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 20px/1.4 var(--font); border-top: 12px solid var(--brand); min-height: 100vh; }
  header { display: flex; gap: 28px; align-items: flex-start; padding: 22px 36px 10px; }
  .head { flex: 1; }
  .step { font-size: 15px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 6px; }
  h1 { font-size: clamp(26px, 3vw, 44px); line-height: 1.2; margin: 0 0 6px; }
  .how { color: var(--muted); margin: 0; }
  .join { text-align: center; font-size: 14px; color: var(--muted); }
  .join img { display: block; width: 104px; height: 104px; margin: 0 auto 4px; background: #fff; padding: 6px; border-radius: 8px; }
  .join.big img { width: min(46vh, 420px); height: min(46vh, 420px); }
  .join.big { font-size: 22px; color: var(--ink); }
  main { padding: 10px 36px 60px; }
  #counter { text-align: center; padding: 8vh 0; }
  #counter .n { font-size: clamp(90px, 16vw, 220px); font-weight: 800; line-height: 1; }
  #counter p { font-size: 28px; color: var(--muted); margin: 8px 0 0; }
  #notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .note { background: var(--note); border-radius: 4px; padding: 14px 16px; box-shadow: 0 2px 4px rgba(0,0,0,.14); white-space: pre-wrap;
          overflow-wrap: anywhere; font-size: clamp(16px, 1.35vw, 22px); min-height: 110px;
          transform-origin: 0 0; transition: background-color .6s; }
  .note.alt { background: var(--note2); }
  #notes.grouped { display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 10px; margin: 6px 0 20px; }
  .legend button { border: 0; cursor: pointer; font-family: inherit; color: inherit; padding: 6px 16px; border-radius: 999px; font-weight: 700;
                   font-size: clamp(17px, 1.6vw, 26px); transition: opacity .35s, transform .35s, box-shadow .2s; }
  .legend button:hover { box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .legend button.off { opacity: 0; transform: scale(.7); }
  .legend button.dim { opacity: .4; }
  .legend small { font-weight: 400; color: var(--muted); font-size: inherit; }
  .theme { margin: 0 0 22px; }
  .theme h3 { display: inline-block; font-size: clamp(17px, 1.5vw, 24px); margin: 0 0 10px; padding: 4px 14px; border-radius: 999px; }
  .theme h3 span { font-weight: 400; color: var(--muted); }
  .theme .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .theme .note { min-height: 0; padding: 10px 12px; font-size: clamp(14px, 1.05vw, 18px); }
  #notes.focus .theme h3 { display: none; }
  #notes.focus .theme .grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  #notes.focus .theme .note { font-size: clamp(16px, 1.35vw, 22px); padding: 14px 16px; }
  .note.pop { animation: pop .5s ease-out; }
  @keyframes pop { 40% { transform: scale(1.07); } }
  .c-gelb { background: #FFF1B8; } .c-grün { background: #D3EFDD; } .c-blau { background: #D6E6FB; } .c-rosa { background: #FAD9E6; }
  .c-orange { background: #FFDDBB; } .c-lila { background: #E6DBF7; } .c-türkis { background: #CDEEEE; } .c-koralle { background: #FFD5CC; }
  .c-none { background: #ECECE6; }
  .note:nth-child(3n) { transform: rotate(.6deg); } .note:nth-child(3n+1) { transform: rotate(-.5deg); }
  #result { background: var(--ai); border-left: 8px solid #3B5B92; border-radius: 6px; padding: 18px 22px; margin: 26px 0 0; }
  #result h2 { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #3B5B92; margin: 0 0 8px; }
  #result .headline { font-size: 26px; font-weight: 700; margin: 0 0 12px; }
  #result h3 { font-size: 16px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 4px; }
  #result ul { margin: 0; padding-left: 22px; } #result li { margin: 0 0 6px; }
  #result q { color: var(--muted); }
  footer { position: fixed; right: 16px; bottom: 10px; background: var(--bg, #fff); padding: 2px 8px; border-radius: 4px; font-size: 13px; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="head">
    <p class="step" id="step"></p>
    <h1 id="q"></h1>
    <p class="how" id="how"></p>
  </div>
  <div class="join" id="join"><img src="qr.png" alt="QR-Code zum Mitschreiben"><span id="url"></span></div>
</header>
<main>
  <div id="counter" hidden><div class="n" id="n">0</div><p id="nlabel">Gedanken bisher</p></div>
  <div id="legend" class="legend" hidden></div>
  <div id="notes"></div>
  <section id="result" hidden></section>
</main>
<footer id="foot"></footer>

<script src="steps.js"></script>
<script>
$('url').textContent = location.href.replace(/^https?:\/\//, '').replace(/wall\.html.*$/, '');
let polling = false, lastRev = null, lastStep = null, prevReleased = null, shownResult = null;
function el(tag, text, cls) { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }

// ---- Post-its: flach, oder nach KI-Themen gruppiert. Der Uebergang ist reine Animation im Browser (keine KI, keine Kosten).
let view = null, wasThemed = false, focus = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function noteEl(r) { const e = el('div', r.body, 'note'); e.dataset.id = r.id; return e; }

function renderFlat() {
  const notes = $('notes'); notes.className = ''; notes.textContent = '';
  view.rows.forEach(r => { const e = noteEl(r); if (r.step !== view.s.show[0]) e.classList.add('alt'); notes.append(e); });
}

function buildLegend() {
  const legend = $('legend'), ids = new Set(view.rows.map(r => r.id)); legend.textContent = ''; legend.hidden = false;
  const chip = (label, n, cls, k) => { const b = el('button', label + ' ', cls); b.append(el('small', '· ' + n)); b.onclick = () => setFocus(focus === k ? null : k); legend.append(b); };
  chip('Alle', view.rows.filter(r => view.themed.includes(r.step)).length, 'c-none', null);
  view.themes.forEach((t, k) => chip(t.label, t.ids.filter(i => ids.has(i)).length, 'c-' + t.color, k));
}

function renderGrouped(reuse) {
  const notes = $('notes'), { rows, themes, themed, s } = view, byId = new Map(rows.map(r => [r.id, r])), used = new Set();
  notes.className = 'grouped'; notes.textContent = '';
  const group = (label, cls, list, key) => { if (!list.length) return; const g = el('div', null, 'theme'), h = el('h3', label + ' ', cls), grid = el('div', null, 'grid');
    g.dataset.k = key; h.append(el('span', '· ' + list.length));
    list.forEach(r => { const e = (reuse && reuse.get(r.id)) || noteEl(r); e.className = 'note ' + cls; grid.append(e); }); g.append(h, grid); notes.append(g); };
  themes.forEach((t, k) => { const list = t.ids.map(i => byId.get(i)).filter(Boolean); list.forEach(r => used.add(r.id)); group(t.label, 'c-' + t.color, list, k); });
  group('Einzelstimmen', 'c-none', rows.filter(r => themed.includes(r.step) && !used.has(r.id)), 'x');
  s.show.filter(x => !themed.includes(x)).forEach(x => group(stepById(x).label, 'alt', rows.filter(r => r.step === x), 'o' + x));
  applyFocus();
}

// Ein Thema antippen (oder Pfeiltasten): nur dessen Post-its zeigen. Nochmal tippen, "Alle" oder Esc: alles.
function applyFocus() {
  const notes = $('notes');
  notes.querySelectorAll('.theme').forEach(g => g.hidden = focus !== null && g.dataset.k !== String(focus));
  [...$('legend').children].forEach((b, i) => b.classList.toggle('dim', focus !== null && i - 1 !== focus));
  notes.classList.toggle('focus', focus !== null);
}
function setFocus(k) { focus = k; applyFocus(); }

// Show-Effekt: Themen erscheinen nacheinander, ihre Post-its faerben sich an Ort und Stelle, dann fliegen alle an ihren Platz.
async function showThemes() {
  const notes = $('notes'), { themes } = view;
  buildLegend(); const chips = [...$('legend').children]; chips.forEach(c => c.classList.add('off'));
  const els = new Map([...notes.querySelectorAll('.note')].map(e => [+e.dataset.id, e]));
  scrollTo({ top: 0, behavior: 'smooth' }); await sleep(500);
  for (const [k, t] of themes.entries()) {
    chips[k + 1].classList.remove('off');
    t.ids.forEach((id, j) => { const e = els.get(id); if (e) setTimeout(() => { e.classList.remove('alt'); e.classList.add('c-' + t.color, 'pop'); }, j * 25); });
    await sleep(480);
  }
  chips[0].classList.remove('off'); await sleep(800);
  const first = new Map([...els].map(([id, e]) => [id, e.getBoundingClientRect()]));
  renderGrouped(els);
  notes.querySelectorAll('.theme h3').forEach(h => h.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: 800, fill: 'backwards' }));
  let i = 0;
  els.forEach((e, id) => { if (!e.isConnected) return; const a = first.get(id), b = e.getBoundingClientRect(); if (!b.width) return;
    e.animate([{ transform: `translate(${a.left - b.left}px,${a.top - b.top}px) scale(${a.width / b.width},${a.height / b.height})` }, { transform: 'none' }],
              { duration: 1300, delay: Math.min(i++ * 5, 500), easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }); });
  await sleep(1900);
}

addEventListener('keydown', async e => {
  if (!view || !view.themes.length || polling) return;
  const n = view.themes.length;
  if (e.key === 'ArrowRight') setFocus(focus === null ? 0 : focus + 1 < n ? focus + 1 : null);
  else if (e.key === 'ArrowLeft') setFocus(focus === null ? n - 1 : focus > 0 ? focus - 1 : null);
  else if (e.key === 'Escape') setFocus(null);
  else if (e.key.toLowerCase() === 'r') { polling = true; focus = null; $('legend').hidden = true; renderFlat(); await sleep(900); await showThemes(); polling = false; }  // Uebergang nochmal zeigen
});

function renderResult(r) {
  const box = $('result'); box.textContent = ''; box.hidden = !r; if (!r) return;
  box.append(el('h2', 'KI-Auswertung'));
  if (r.headline) box.append(el('p', r.headline, 'headline'));
  const sec = (title, arr, fn) => { if (!arr || !arr.length) return; box.append(el('h3', title)); const ul = el('ul'); arr.forEach(x => ul.append(fn(x))); box.append(ul); };
  sec('Was viele ähnlich sehen', r.convergence, c => { const li = el('li'); li.append(el('strong', c.label + (c.ids ? ' (' + c.ids.length + ')' : '')));
        if (c.quote) { li.append(document.createTextNode(' ')); li.append(el('q', c.quote)); } return li; });
  sec('Wo es auseinandergeht', r.tension, t => { const li = el('li'); li.append(el('strong', t.label)); li.append(document.createTextNode(': ' + t.a + ' ↔ ' + t.b)); return li; });
  sec('Was noch fehlt', r.blind_spots, b => { const li = el('li'); li.append(el('strong', b.label)); if (b.why) li.append(document.createTextNode(': ' + b.why)); return li; });
}

async function refresh(st) {
  const s = stepById(st.step);
  $('step').textContent = s.label; $('q').textContent = s.q; $('how').textContent = s.how || '';
  $('join').className = 'join' + (st.step === 0 ? ' big' : '');
  $('foot').textContent = st.people + (st.people === 1 ? ' Handy hat' : ' Handys haben') + ' schon beigetragen';
  const counter = s.solo && st.wall === 'counter';
  $('counter').hidden = !counter; $('n').textContent = st.count;
  $('nlabel').textContent = st.count === 1 ? 'Gedanke bisher' : 'Gedanken bisher';
  const notes = $('notes'), legend = $('legend'); notes.hidden = counter;
  let themes = [];
  if (!counter && s.show.length) {
    const rows = await rpc('lf_wall', { p_steps: s.show });
    // Themen: sobald die KI zugeordnet hat, haengen die Post-its nach Themen gruppiert und eingefaerbt (ohne Freigabe).
    const themed = s.show.filter(x => st.released.includes(String(THEMES + x)));
    themes = (await Promise.all(themed.map(x => rpc('lf_result', { p_step: THEMES + x })))).flatMap(t => (t && t.themes) || []);
    view = { rows, themes, themed, s };
    if (focus !== null && focus >= themes.length) focus = null;
    if (!themes.length) renderFlat();
    else if (!wasThemed && notes.querySelector(':scope > .note')) await showThemes();   // Post-its hingen schon: Uebergang zeigen
    else { buildLegend(); renderGrouped(); }
  } else { notes.textContent = ''; view = null; }
  wasThemed = themes.length > 0; legend.hidden = !themes.length;
  // KI-Auswertung: eine frisch freigegebene erscheint sofort, egal in welchem Schritt, auch im Zaehler-Modus (Felix, 12.11.).
  // Sonst bleibt die angezeigte stehen; beim Laden: die zum Schritt passende, sonst die hoechste.
  const rel = st.released.map(Number).filter(x => x < THEMES);
  const fresh = prevReleased ? rel.filter(x => !prevReleased.includes(x)) : [];
  if (fresh.length) shownResult = Math.max(...fresh);
  else if (!rel.includes(shownResult)) {
    const mine = s.show.filter(x => rel.includes(x));
    shownResult = mine.length ? mine[mine.length - 1] : (rel.length ? Math.max(...rel) : null);
  }
  prevReleased = rel;
  renderResult(shownResult != null ? await rpc('lf_result', { p_step: shownResult }) : null);
}

async function poll() {
  if (polling) return; polling = true;
  try { const st = await rpc('lf_get_state', null, 5000);
        const sig = st.rev + '|' + st.step + '|' + st.wall + '|' + st.released.join(',');
        if (sig !== lastRev) { lastRev = sig; await refresh(st); } }
  catch (e) { lastRev = null; }
  polling = false;
}
setInterval(poll, 2500); poll();
</script>
</body>
</html>
