&lt;script&gt;// Gemeinsame Bühne: skaliert 1600x900 auf das Fenster, Schritte per Klick/Pfeiltasten, Tooltip.
const NS = &quot;http://www.w3.org/2000/svg&quot;;
// Standbild-Modus (?schritt=N): keine Animationen, Verzögerungen sofort ausführen
const STILL = new URLSearchParams(location.search).has(&quot;schritt&quot;);
if (STILL) { window.setTimeout = (f) =&gt; (f(), 0); document.documentElement.classList.add(&quot;still&quot;); }
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function skalieren() {
  const b = document.getElementById(&quot;buehne&quot;);
  const s = Math.min(innerWidth / 1600, innerHeight / 900);
  b.style.transformOrigin = &quot;50% 50%&quot;;
  b.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener(&quot;resize&quot;, skalieren);

// Datum &quot;YYYY-MM&quot; oder &quot;YYYY-MM-DD&quot; -&gt; Dezimaljahr
function dj(s) {
  const [y, m = 1, d = 15] = String(s).split(&quot;-&quot;).map(Number);
  return y + (m - 1) / 12 + (d - 1) / 365;
}
const fmt = (v, n = 0) =&gt; v.toLocaleString(&quot;de-DE&quot;, { maximumFractionDigits: n, minimumFractionDigits: n });

// Tooltip
let tipEl;
function tip(target, html) {
  target.style.cursor = &quot;pointer&quot;;
  target.addEventListener(&quot;mouseenter&quot;, () =&gt; { tipEl.innerHTML = html; tipEl.style.opacity = 1; });
  target.addEventListener(&quot;mousemove&quot;, (e) =&gt; {
    const b = document.getElementById(&quot;buehne&quot;).getBoundingClientRect();
    const s = b.width / 1600;
    let x = (e.clientX - b.left) / s + 16, y = (e.clientY - b.top) / s + 16;
    if (x &gt; 1200) x -= 400;
    tipEl.style.left = x + &quot;px&quot;; tipEl.style.top = y + &quot;px&quot;;
  });
  target.addEventListener(&quot;mouseleave&quot;, () =&gt; (tipEl.style.opacity = 0));
}

// Firmenlogo neben eine Beschriftung setzen (auf der vom Datenpunkt abgewandten Seite)
function logo(t, firmen, gr = 24) {
  const b = t.getBBox(), links = t.getAttribute(&quot;text-anchor&quot;) === &quot;end&quot;;
  const fs = [].concat(firmen);
  let x = links ? b.x - 8 - fs.length * (gr + 4) + 4 : b.x + b.width + 8;
  for (const f of fs) {
    el(&quot;image&quot;, { href: LOGOS[f], x, y: b.y + b.height / 2 - gr / 2, width: gr, height: gr }, t.parentNode);
    x += gr + 4;
  }
}

// Linie progressiv zeichnen
function zeichne(path, ms = 1800) {
  if (STILL) return;
  const L = path.getTotalLength();
  path.style.transition = &quot;none&quot;;
  path.style.strokeDasharray = L; path.style.strokeDashoffset = L;
  path.getBoundingClientRect();
  path.style.transition = `stroke-dashoffset ${ms}ms ease-in-out`;
  path.style.strokeDashoffset = 0;
}
function zeigen(nodes, an, delay = 0) {
  [].concat(nodes).forEach((n, i) =&gt; {
    if (!n) return;
    n.style.transition = &quot;opacity .6s&quot;;
    setTimeout(() =&gt; (n.style.opacity = an ? 1 : 0), an ? delay * i : 0);
  });
}

// Schrittsteuerung: schritte = [fn(an:boolean)], jeder Schritt baut auf dem vorigen auf
function stepper(schritte, start = 0) {
  let i = -1;
  const leiste = document.querySelector(&quot;.leiste&quot;);
  const punkte = leiste.querySelector(&quot;.punkte&quot;);
  schritte.forEach((_, k) =&gt; {
    const p = document.createElement(&quot;i&quot;);
    p.title = `Schritt ${k + 1}`;
    p.onclick = () =&gt; gehe(k);
    punkte.appendChild(p);
  });
  function gehe(z) {
    z = Math.max(0, Math.min(schritte.length - 1, z));
    if (z &gt; i) for (let k = i + 1; k &lt;= z; k++) schritte[k](true);
    else for (let k = i; k &gt; z; k--) schritte[k](false);
    i = z;
    [...punkte.children].forEach((p, k) =&gt; p.classList.toggle(&quot;an&quot;, k &lt;= i));
  }
  // In der Gesamtdatei (iframe): am Ende/Anfang an die nächste/vorige Grafik übergeben
  const imRahmen = window.parent !== window;
  const weiter = () =&gt; (imRahmen &amp;&amp; i &gt;= schritte.length - 1 ? parent.postMessage({ kapitel: &quot;vor&quot; }, &quot;*&quot;) : gehe(i + 1));
  const zurueck = () =&gt; (imRahmen &amp;&amp; i &lt;= 0 ? parent.postMessage({ kapitel: &quot;zurueck&quot; }, &quot;*&quot;) : gehe(i - 1));
  addEventListener(&quot;message&quot;, (e) =&gt; {
    const d = e.data || {};
    if (d.taste === &quot;vor&quot;) weiter();
    if (d.taste === &quot;zurueck&quot;) zurueck();
    if (d.schritt != null) gehe(d.schritt &lt; 0 ? schritte.length - 1 : d.schritt - 1);
  });
  leiste.querySelector(&quot;.zur&quot;).onclick = zurueck;
  leiste.querySelector(&quot;.vor&quot;).onclick = weiter;
  leiste.querySelector(&quot;.alles&quot;).onclick = () =&gt; gehe(schritte.length - 1);
  addEventListener(&quot;keydown&quot;, (e) =&gt; {
    if ([&quot;ArrowRight&quot;, &quot;PageDown&quot;, &quot; &quot;, &quot;Enter&quot;].includes(e.key)) { e.preventDefault(); weiter(); }
    if ([&quot;ArrowLeft&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;].includes(e.key)) { e.preventDefault(); zurueck(); }
    if (e.key === &quot;End&quot;) gehe(schritte.length - 1);
    if (e.key === &quot;Home&quot;) location.reload();
  });
  document.querySelector(&quot;svg&quot;).addEventListener(&quot;click&quot;, (e) =&gt; { if (e.target.tagName === &quot;svg&quot;) weiter(); });
  // ?schritt=N (für Standbilder)
  const q = new URLSearchParams(location.search).get(&quot;schritt&quot;);
  gehe(q ? Number(q) - 1 : start);
}

addEventListener(&quot;DOMContentLoaded&quot;, () =&gt; {
  tipEl = document.createElement(&quot;div&quot;); tipEl.className = &quot;tip&quot;;
  document.getElementById(&quot;buehne&quot;).appendChild(tipEl);

const A = DATEN.A, svg = document.getElementById(&quot;chart&quot;);
const X0 = 130, X1 = 1180, Y0 = 770, Y1 = 205;
const T0 = 2024.0, T1 = 2027.0;
const sx = (t) =&gt; X0 + (t - T0) / (T1 - T0) * (X1 - X0);
const sy = (iq) =&gt; Y0 - (iq - 60) / (160 - 60) * (Y0 - Y1);

// ---------- IQ-Ansicht ----------
const gIQ = el(&quot;g&quot;, {}, svg);
const raster = el(&quot;g&quot;, { class: &quot;raster&quot; }, gIQ), achse = el(&quot;g&quot;, { class: &quot;achse&quot; }, gIQ);
for (let iq = 60; iq &lt;= 160; iq += 10) {

  el(&quot;text&quot;, { x: X0 - 12, y: sy(iq) + 5, &quot;text-anchor&quot;: &quot;end&quot; }, achse).textContent = iq;
}
el(&quot;text&quot;, { x: X0 - 60, y: Y1 - 18, style: &quot;font-size:13px;fill:#666&quot; }, achse).textContent = &quot;IQ&quot;;
for (let y = 2024; y &lt;= 2026; y++) {

    const t = y + m;
    el(&quot;line&quot;, { x1: sx(t), x2: sx(t), y1: Y0, y2: Y0 + 6 }, achse);
    el(&quot;text&quot;, { x: sx(t), y: Y0 + 26, &quot;text-anchor&quot;: &quot;middle&quot;, style: m ? &quot;font-size:12px&quot; : &quot;font-weight:bold&quot; }, achse).textContent = lab;

}

el(&quot;line&quot;, { x1: X0, x2: X0, y1: Y0, y2: Y1 }, achse);

// Frontier-Linien
function pfad(key) {
  const p = A.frontier.filter((f) =&gt; f[key] != null);
  return p.map((f, i) =&gt; `${i ? &quot;L&quot; : &quot;M&quot;}${sx(dj(f.m))},${sy(f[key])}`).join(&quot; &quot;);
}

function punkte(key, farbe, g) {

    const c = el(&quot;circle&quot;, { cx: sx(dj(m.date)), cy: sy(m[key]), r: 6, fill: &quot;#fff&quot;, stroke: farbe, &quot;stroke-width&quot;: 2.5 }, g);

}

&lt;script&gt;// Gemeinsame Bühne: skaliert 1600x900 auf das Fenster, Schritte per Klick/Pfeiltasten, Tooltip.
const NS = &quot;http://www.w3.org/2000/svg&quot;;
// Standbild-Modus (?schritt=N): keine Animationen, Verzögerungen sofort ausführen
const STILL = new URLSearchParams(location.search).has(&quot;schritt&quot;);
if (STILL) { window.setTimeout = (f) =&gt; (f(), 0); document.documentElement.classList.add(&quot;still&quot;); }
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function skalieren() {
  const b = document.getElementById(&quot;buehne&quot;);
  const s = Math.min(innerWidth / 1600, innerHeight / 900);
  b.style.transformOrigin = &quot;50% 50%&quot;;
  b.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener(&quot;resize&quot;, skalieren);

// Datum &quot;YYYY-MM&quot; oder &quot;YYYY-MM-DD&quot; -&gt; Dezimaljahr
function dj(s) {
  const [y, m = 1, d = 15] = String(s).split(&quot;-&quot;).map(Number);
  return y + (m - 1) / 12 + (d - 1) / 365;
}
const fmt = (v, n = 0) =&gt; v.toLocaleString(&quot;de-DE&quot;, { maximumFractionDigits: n, minimumFractionDigits: n });

// Tooltip
let tipEl;
function tip(target, html) {
  target.style.cursor = &quot;pointer&quot;;
  target.addEventListener(&quot;mouseenter&quot;, () =&gt; { tipEl.innerHTML = html; tipEl.style.opacity = 1; });
  target.addEventListener(&quot;mousemove&quot;, (e) =&gt; {
    const b = document.getElementById(&quot;buehne&quot;).getBoundingClientRect();
    const s = b.width / 1600;
    let x = (e.clientX - b.left) / s + 16, y = (e.clientY - b.top) / s + 16;
    if (x &gt; 1200) x -= 400;
    tipEl.style.left = x + &quot;px&quot;; tipEl.style.top = y + &quot;px&quot;;
  });
  target.addEventListener(&quot;mouseleave&quot;, () =&gt; (tipEl.style.opacity = 0));
}

// Firmenlogo neben eine Beschriftung setzen (auf der vom Datenpunkt abgewandten Seite)

  name.textContent = r.product;

  const b = el(&quot;rect&quot;, { x: RX0, y, width: 0, height: 56, fill: chat ? &quot;var(--gelb)&quot; : &quot;#d6d6d6&quot; }, gRennen);

&lt;script&gt;// Gemeinsame Bühne: skaliert 1600x900 auf das Fenster, Schritte per Klick/Pfeiltasten, Tooltip.
const NS = &quot;http://www.w3.org/2000/svg&quot;;
// Standbild-Modus (?schritt=N): keine Animationen, Verzögerungen sofort ausführen
const STILL = new URLSearchParams(location.search).has(&quot;schritt&quot;);
if (STILL) { window.setTimeout = (f) =&gt; (f(), 0); document.documentElement.classList.add(&quot;still&quot;); }
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function skalieren() {
  const b = document.getElementById(&quot;buehne&quot;);
  const s = Math.min(innerWidth / 1600, innerHeight / 900);
  b.style.transformOrigin = &quot;50% 50%&quot;;
  b.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener(&quot;resize&quot;, skalieren);

// Datum &quot;YYYY-MM&quot; oder &quot;YYYY-MM-DD&quot; -&gt; Dezimaljahr
function dj(s) {
  const [y, m = 1, d = 15] = String(s).split(&quot;-&quot;).map(Number);
  return y + (m - 1) / 12 + (d - 1) / 365;
}
const fmt = (v, n = 0) =&gt; v.toLocaleString(&quot;de-DE&quot;, { maximumFractionDigits: n, minimumFractionDigits: n });

// Tooltip
let tipEl;
function tip(target, html) {
  target.style.cursor = &quot;pointer&quot;;
  target.addEventListener(&quot;mouseenter&quot;, () =&gt; { tipEl.innerHTML = html; tipEl.style.opacity = 1; });
  target.addEventListener(&quot;mousemove&quot;, (e) =&gt; {
    const b = document.getElementById(&quot;buehne&quot;).getBoundingClientRect();
    const s = b.width / 1600;
    let x = (e.clientX - b.left) / s + 16, y = (e.clientY - b.top) / s + 16;
    if (x &gt; 1200) x -= 400;
    tipEl.style.left = x + &quot;px&quot;; tipEl.style.top = y + &quot;px&quot;;
  });

&lt;script&gt;
const C = DATEN.C, svg = document.getElementById(&quot;chart&quot;);
const X0 = 150, X1 = 1180, Y0 = 760, Y1 = 215, T0 = 2022.75, T1 = 2030.75, P1 = 100;
const sx = (t) =&gt; X0 + (t - T0) / (T1 - T0) * (X1 - X0);
const sy = (p) =&gt; Y0 - p / P1 * (Y0 - Y1);
// Microsoft-Halbjahre/Quartale -&gt; Mitte des Zeitraums (wie in der Auswertung)
const MS_T = { &quot;2025-H1&quot;: 2025.29, &quot;2025-H2&quot;: 2025.79, &quot;2026-Q1&quot;: 2026.12, &quot;2026-Q2&quot;: 2026.37 };
const tt = (s) =&gt; MS_T[s] ?? dj(s);

const ach = el(&quot;g&quot;, { class: &quot;achse&quot; }, svg);
for (let p = 0; p &lt;= 100; p += 10) {
  el(&quot;line&quot;, { x1: X0, x2: X1, y1: sy(p), y2: sy(p), stroke: &quot;#eee&quot; }, svg);
  el(&quot;text&quot;, { x: X0 - 12, y: sy(p) + 5, &quot;text-anchor&quot;: &quot;end&quot; }, ach).textContent = `${p} %`;
}
for (let y = 2023; y &lt;= 2030; y++) {
  el(&quot;line&quot;, { x1: sx(y), x2: sx(y), y1: Y0, y2: Y0 + 6 }, ach);
  el(&quot;text&quot;, { x: sx(y), y: Y0 + 26, &quot;text-anchor&quot;: &quot;middle&quot;, style: &quot;font-weight:bold&quot; }, ach).textContent = y;
}
el(&quot;line&quot;, { x1: X0, x2: X1, y1: Y0, y2: Y0 }, ach);
// Heute-Linie
el(&quot;line&quot;, { x1: sx(dj(&quot;2026-10-20&quot;)), x2: sx(dj(&quot;2026-10-20&quot;)), y1: Y0, y2: Y1, stroke: &quot;#bbb&quot;, &quot;stroke-width&quot;: 1.5 }, svg);
el(&quot;text&quot;, { x: sx(dj(&quot;2026-10-20&quot;)) + 6, y: Y1 + 12, style: &quot;font-size:13px;fill:#888&quot; }, svg).textContent = &quot;heute&quot;;
// ChatGPT-Start
el(&quot;line&quot;, { x1: sx(dj(&quot;2022-11-30&quot;)), x2: sx(dj(&quot;2022-11-30&quot;)), y1: Y0, y2: Y1 + 40, stroke: &quot;var(--gelb)&quot;, &quot;stroke-width&quot;: 3 }, svg);
el(&quot;text&quot;, { x: sx(dj(&quot;2022-11-30&quot;)) + 8, y: Y0 - 12, style: &quot;font-size:14px;font-weight:bold&quot; }, svg).textContent = &quot;ChatGPT-Start&quot;;

function reihe(pts, f, w, name, info, g, dash) {
  const p = el(&quot;path&quot;, { d: pts.map((q, i) =&gt; `${i ? &quot;L&quot; : &quot;M&quot;}${sx(tt(q[0]))},${sy(q[1])}`).join(&quot; &quot;), fill: &quot;none&quot;, stroke: f, &quot;stroke-width&quot;: w, &quot;stroke-linejoin&quot;: &quot;round&quot;, ...(dash ? { &quot;stroke-dasharray&quot;: dash } : {}) }, g);
  for (const q of pts) {
    const c = el(&quot;circle&quot;, { cx: sx(tt(q[0])), cy: sy(q[1]), r: w &gt; 4 ? 6 : 4.5, fill: &quot;#fff&quot;, stroke: f, &quot;stroke-width&quot;: 2.5 }, g);
    tip(c, `&lt;b&gt;${name}&lt;/b&gt;${q[0]}: &lt;b style=&quot;display:inline&quot;&gt;${fmt(q[1], 1)} %&lt;/b&gt;&lt;br&gt;&lt;small&gt;${info}&lt;/small&gt;`);
  }
  return p;
}
function endlabel(g, pts, text, f, dy = 5) {
  const q = pts[pts.length - 1];
  el(&quot;text&quot;, { x: sx(tt(q[0])) + 12, y: sy(q[1]) + dy, style: `font-size:16px;font-weight:bold;fill:${f}` }, g).textContent = text;
}
const B = C.bevoelkerung;

// USA

endlabel(gUSA, B.usa_18_64_RPS.points, &quot;USA: 62 %&quot;, &quot;#1a1a1a&quot;);

endlabel(gUSA, B.china_CNNIC.points, &quot;China: 50 %&quot;, &quot;var(--teal)&quot;);

const EB = { x: 1290, w: 230, y0: Y0 };
el(&quot;text&quot;, { x: EB.x, y: 455, style: &quot;font-size:14px;font-weight:bold&quot; }, gDE).textContent = &quot;Erwerbstätige DE 2025&quot;;
const E = C.arbeit.eurostat_2025_erwerbstaetige_25_64_fuer_arbeit;

const bEls = balken.map(([v, lab, info], i) =&gt; {
  const x = EB.x + i * 120, h = sy(0) - sy(v);
  const r = el(&quot;rect&quot;, { x, y: sy(v), width: 90, height: h, fill: i ? &quot;var(--magenta)&quot; : &quot;#f5b3d0&quot; }, gDE);
  el(&quot;text&quot;, { x: x + 45, y: sy(v) - 10, &quot;text-anchor&quot;: &quot;middle&quot;, style: &quot;font-size:20px;font-weight:bold&quot; }, gDE).textContent = `${fmt(v, 0)} %`;
  el(&quot;text&quot;, { x: x + 45, y: Y0 + 22, &quot;text-anchor&quot;: &quot;middle&quot;, style: &quot;font-size:13px&quot; }, gDE).textContent = lab;
  tip(r, `&lt;b&gt;Deutschland 2025: ${fmt(v, 1)} %&lt;/b&gt;${lab}&lt;br&gt;&lt;small&gt;${info}; Eurostat isoc_ai_iaiu, amtliche Statistik&lt;/small&gt;`);
  return r;
});

const H = C.hochrechnung, gH = el(&quot;g&quot;, { opacity: 0 }, svg);
function korridor(start, pts, f) {
  const jahre = Object.keys(pts);
  const lo = jahre.map((j) =&gt; [Number(j) + 0.5, pts[j][0]]), hi = jahre.map((j) =&gt; [Number(j) + 0.5, pts[j][pts[j].length - 1]]);
  const d = `M${sx(start[0])},${sy(start[1])} ` + hi.map((q) =&gt; `L${sx(q[0])},${sy(q[1])}`).join(&quot; &quot;) + &quot; &quot; + lo.reverse().map((q) =&gt; `L${sx(q[0])},${sy(q[1])}`).join(&quot; &quot;) + &quot; Z&quot;;
  el(&quot;path&quot;, { d, fill: f, &quot;fill-opacity&quot;: 0.18, stroke: f, &quot;stroke-width&quot;: 2, &quot;stroke-dasharray&quot;: &quot;7 5&quot; }, gH);
}
korridor([2026.25, 61.8], H.usa_RPS_korridor.points, &quot;#1a1a1a&quot;);
korridor([2026.46, 50.0], H.china_CNNIC_korridor.points, &quot;var(--teal)&quot;);

&lt;script&gt;// Gemeinsame Bühne: skaliert 1600x900 auf das Fenster, Schritte per Klick/Pfeiltasten, Tooltip.
const NS = &quot;http://www.w3.org/2000/svg&quot;;
// Standbild-Modus (?schritt=N): keine Animationen, Verzögerungen sofort ausführen
const STILL = new URLSearchParams(location.search).has(&quot;schritt&quot;);
if (STILL) { window.setTimeout = (f) =&gt; (f(), 0); document.documentElement.classList.add(&quot;still&quot;); }
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function skalieren() {
  const b = document.getElementById(&quot;buehne&quot;);
  const s = Math.min(innerWidth / 1600, innerHeight / 900);
  b.style.transformOrigin = &quot;50% 50%&quot;;
  b.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener(&quot;resize&quot;, skalieren);

// Datum &quot;YYYY-MM&quot; oder &quot;YYYY-MM-DD&quot; -&gt; Dezimaljahr
function dj(s) {
  const [y, m = 1, d = 15] = String(s).split(&quot;-&quot;).map(Number);
  return y + (m - 1) / 12 + (d - 1) / 365;
}
const fmt = (v, n = 0) =&gt; v.toLocaleString(&quot;de-DE&quot;, { maximumFractionDigits: n, minimumFractionDigits: n });

// Tooltip
let tipEl;
function tip(target, html) {
  target.style.cursor = &quot;pointer&quot;;
  target.addEventListener(&quot;mouseenter&quot;, () =&gt; { tipEl.innerHTML = html; tipEl.style.opacity = 1; });
  target.addEventListener(&quot;mousemove&quot;, (e) =&gt; {
    const b = document.getElementById(&quot;buehne&quot;).getBoundingClientRect();
    const s = b.width / 1600;
    let x = (e.clientX - b.left) / s + 16, y = (e.clientY - b.top) / s + 16;
    if (x &gt; 1200) x -= 400;
    tipEl.style.left = x + &quot;px&quot;; tipEl.style.top = y + &quot;px&quot;;
  });
  target.addEventListener(&quot;mouseleave&quot;, () =&gt; (tipEl.style.opacity = 0));
}

// Firmenlogo neben eine Beschriftung setzen (auf der vom Datenpunkt abgewandten Seite)
function logo(t, firmen, gr = 24) {

// Schrittsteuerung: schritte = [fn(an:boolean)], jeder Schritt baut auf dem vorigen auf
function stepper(schritte, start = 0) {

  const punkte = leiste.querySelector(&quot;.punkte&quot;);
  schritte.forEach((_, k) =&gt; {

    p.onclick = () =&gt; gehe(k);

    if (z &gt; i) for (let k = i + 1; k &lt;= z; k++) schritte[k](true);

  const imRahmen = window.parent !== window;
  const weiter = () =&gt; (imRahmen &amp;&amp; i &gt;= schritte.length - 1 ? parent.postMessage({ kapitel: &quot;vor&quot; }, &quot;*&quot;) : gehe(i + 1));
  const zurueck = () =&gt; (imRahmen &amp;&amp; i &lt;= 0 ? parent.postMessage({ kapitel: &quot;zurueck&quot; }, &quot;*&quot;) : gehe(i - 1));
  addEventListener(&quot;message&quot;, (e) =&gt; {
    const d = e.data || {};
    if (d.taste === &quot;vor&quot;) weiter();
    if (d.taste === &quot;zurueck&quot;) zurueck();
    if (d.schritt != null) gehe(d.schritt &lt; 0 ? schritte.length - 1 : d.schritt - 1);
  });
  leiste.querySelector(&quot;.zur&quot;).onclick = zurueck;
  leiste.querySelector(&quot;.vor&quot;).onclick = weiter;
  leiste.querySelector(&quot;.alles&quot;).onclick = () =&gt; gehe(schritte.length - 1);
  addEventListener(&quot;keydown&quot;, (e) =&gt; {
    if ([&quot;ArrowRight&quot;, &quot;PageDown&quot;, &quot; &quot;, &quot;Enter&quot;].includes(e.key)) { e.preventDefault(); weiter(); }
    if ([&quot;ArrowLeft&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;].includes(e.key)) { e.preventDefault(); zurueck(); }

}

&lt;script&gt;// Gemeinsame Bühne: skaliert 1600x900 auf das Fenster, Schritte per Klick/Pfeiltasten, Tooltip.
const NS = &quot;http://www.w3.org/2000/svg&quot;;
// Standbild-Modus (?schritt=N): keine Animationen, Verzögerungen sofort ausführen
const STILL = new URLSearchParams(location.search).has(&quot;schritt&quot;);
if (STILL) { window.setTimeout = (f) =&gt; (f(), 0); document.documentElement.classList.add(&quot;still&quot;); }
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function skalieren() {
  const b = document.getElementById(&quot;buehne&quot;);
  const s = Math.min(innerWidth / 1600, innerHeight / 900);
  b.style.transformOrigin = &quot;50% 50%&quot;;
  b.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener(&quot;resize&quot;, skalieren);

// Datum &quot;YYYY-MM&quot; oder &quot;YYYY-MM-DD&quot; -&gt; Dezimaljahr
function dj(s) {
  const [y, m = 1, d = 15] = String(s).split(&quot;-&quot;).map(Number);
  return y + (m - 1) / 12 + (d - 1) / 365;
}
const fmt = (v, n = 0) =&gt; v.toLocaleString(&quot;de-DE&quot;, { maximumFractionDigits: n, minimumFractionDigits: n });

// Tooltip
let tipEl;
function tip(target, html) {
  target.style.cursor = &quot;pointer&quot;;
  target.addEventListener(&quot;mouseenter&quot;, () =&gt; { tipEl.innerHTML = html; tipEl.style.opacity = 1; });
  target.addEventListener(&quot;mousemove&quot;, (e) =&gt; {
    const b = document.getElementById(&quot;buehne&quot;).getBoundingClientRect();
    const s = b.width / 1600;
    let x = (e.clientX - b.left) / s + 16, y = (e.clientY - b.top) / s + 16;
    if (x &gt; 1200) x -= 400;
    tipEl.style.left = x + &quot;px&quot;; tipEl.style.top = y + &quot;px&quot;;
  });
  target.addEventListener(&quot;mouseleave&quot;, () =&gt; (tipEl.style.opacity = 0));
}

// Firmenlogo neben eine Beschriftung setzen (auf der vom Datenpunkt abgewandten Seite)
function logo(t, firmen, gr = 24) {
  const b = t.getBBox(), links = t.getAttribute(&quot;text-anchor&quot;) === &quot;end&quot;;
  const fs = [].concat(firmen);
  let x = links ? b.x - 8 - fs.length * (gr + 4) + 4 : b.x + b.width + 8;
  for (const f of fs) {
    el(&quot;image&quot;, { href: LOGOS[f], x, y: b.y + b.height / 2 - gr / 2, width: gr, height: gr }, t.parentNode);
    x += gr + 4;
  }
}

// Linie progressiv zeichnen
function zeichne(path, ms = 1800) {
  if (STILL) return;
  const L = path.getTotalLength();
  path.style.transition = &quot;none&quot;;
  path.style.strokeDasharray = L; path.style.strokeDashoffset = L;
  path.getBoundingClientRect();
  path.style.transition = `stroke-dashoffset ${ms}ms ease-in-out`;
  path.style.strokeDashoffset = 0;
}
function zeigen(nodes, an, delay = 0) {
  [].concat(nodes).forEach((n, i) =&gt; {
    if (!n) return;
    n.style.transition = &quot;opacity .6s&quot;;
    setTimeout(() =&gt; (n.style.opacity = an ? 1 : 0), an ? delay * i : 0);
  });
}

// Schrittsteuerung: schritte = [fn(an:boolean)], jeder Schritt baut auf dem vorigen auf
function stepper(schritte, start = 0) {
  let i = -1;
  const leiste = document.querySelector(&quot;.leiste&quot;);
  const punkte = leiste.querySelector(&quot;.punkte&quot;);
  schritte.forEach((_, k) =&gt; {
    const p = document.createElement(&quot;i&quot;);
    p.title = `Schritt ${k + 1}`;
    p.onclick = () =&gt; gehe(k);
    punkte.appendChild(p);
  });
  function gehe(z) {
    z = Math.max(0, Math.min(schritte.length - 1, z));
    if (z &gt; i) for (let k = i + 1; k &lt;= z; k++) schritte[k](true);
    else for (let k = i; k &gt; z; k--) schritte[k](false);
    i = z;
    [...punkte.children].forEach((p, k) =&gt; p.classList.toggle(&quot;an&quot;, k &lt;= i));
  }
  // In der Gesamtdatei (iframe): am Ende/Anfang an die nächste/vorige Grafik übergeben
  const imRahmen = window.parent !== window;
  const weiter = () =&gt; (imRahmen &amp;&amp; i &gt;= schritte.length - 1 ? parent.postMessage({ kapitel: &quot;vor&quot; }, &quot;*&quot;) : gehe(i + 1));
  const zurueck = () =&gt; (imRahmen &amp;&amp; i &lt;= 0 ? parent.postMessage({ kapitel: &quot;zurueck&quot; }, &quot;*&quot;) : gehe(i - 1));
  addEventListener(&quot;message&quot;, (e) =&gt; {
    const d = e.data || {};
    if (d.taste === &quot;vor&quot;) weiter();
    if (d.taste === &quot;zurueck&quot;) zurueck();
    if (d.schritt != null) gehe(d.schritt &lt; 0 ? schritte.length - 1 : d.schritt - 1);
  });
  leiste.querySelector(&quot;.zur&quot;).onclick = zurueck;
  leiste.querySelector(&quot;.vor&quot;).onclick = weiter;
  leiste.querySelector(&quot;.alles&quot;).onclick = () =&gt; gehe(schritte.length - 1);
  addEventListener(&quot;keydown&quot;, (e) =&gt; {
    if ([&quot;ArrowRight&quot;, &quot;PageDown&quot;, &quot; &quot;, &quot;Enter&quot;].includes(e.key)) { e.preventDefault(); weiter(); }
    if ([&quot;ArrowLeft&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;].includes(e.key)) { e.preventDefault(); zurueck(); }
    if (e.key === &quot;End&quot;) gehe(schritte.length - 1);
    if (e.key === &quot;Home&quot;) location.reload();
  });
  document.querySelector(&quot;svg&quot;).addEventListener(&quot;click&quot;, (e) =&gt; { if (e.target.tagName === &quot;svg&quot;) weiter(); });
  // ?schritt=N (für Standbilder)
  const q = new URLSearchParams(location.search).get(&quot;schritt&quot;);
  gehe(q ? Number(q) - 1 : start);
}

addEventListener(&quot;DOMContentLoaded&quot;, () =&gt; {
  tipEl = document.createElement(&quot;div&quot;); tipEl.className = &quot;tip&quot;;
  document.getElementById(&quot;buehne&quot;).appendChild(tipEl);
  skalieren();
